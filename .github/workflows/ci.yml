name: Build & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore & Build Solution (Release)
        run: dotnet build MicMute.sln -c Release --nologo

      - name: Run Regression Tests
        run: dotnet run --project tests/MicMute.Tests/MicMute.Tests.csproj -c Release --no-build
