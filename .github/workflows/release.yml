name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Determine Release Tag & Stamp Assembly Version
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $cleanVer = ($tag.TrimStart('v', 'V') -split '[-+]')[0]
          if ($cleanVer -match '^\d+\.\d+(\.\d+)?(\.\d+)?$') {
            $parts = $cleanVer.Split('.')
            while ($parts.Length -lt 4) { $parts += '0' }
            $asmVer = ($parts[0..3] -join '.')
            $infoPath = 'src/MicMute/AssemblyInfo.cs'
            $content = Get-Content -LiteralPath $infoPath -Raw
            $content = [regex]::Replace($content, 'AssemblyVersion\("[^"]+"\)', "AssemblyVersion(`"$asmVer`")")
            $content = [regex]::Replace($content, 'AssemblyFileVersion\("[^"]+"\)', "AssemblyFileVersion(`"$asmVer`")")
            $content = [regex]::Replace($content, 'AssemblyInformationalVersion\("[^"]+"\)', "AssemblyInformationalVersion(`"$cleanVer`")")
            Set-Content -LiteralPath $infoPath -Value $content -NoNewline
            Write-Host "Stamped AssemblyVersion & AssemblyFileVersion = $asmVer, Informational = $cleanVer (from tag $tag)"
          }

      - name: Build & Run All Tests
        run: |
          dotnet build MicMute.sln -c Release --nologo
          dotnet run --project tests/MicMute.Tests/MicMute.Tests.csproj -c Release --no-build

      - name: Publish Lightweight & Standalone Binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-out -Force | Out-Null

          # 1. Lightweight build (~1.4 MB single-file, requires .NET 8 Desktop Runtime x64)
          dotnet publish src/MicMute/MicMute.csproj -c Release -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -o stage-light

          # 2. Standalone build (self-contained single-file, zero prerequisites)
          dotnet publish src/MicMute/MicMute.csproj -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -o stage-standalone

      - name: Check SignPath Configuration
        id: signpath_check
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG_ID: ${{ secrets.SIGNPATH_ORG_ID }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN) -and -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_ORG_ID)) {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "SignPath code signing is configured and enabled."
          } else {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "SignPath secrets not configured; publishing unsigned release artifacts."
          }

      - name: Upload Unsigned Lightweight Artifact for SignPath
        id: upload_unsigned_light
        if: steps.signpath_check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-micmute-light
          path: stage-light/MicMute.exe
          retention-days: 1

      - name: Sign Lightweight Binary via SignPath
        if: steps.signpath_check.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: micmute
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload_unsigned_light.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: stage-light-signed

      - name: Upload Unsigned Standalone Artifact for SignPath
        id: upload_unsigned_standalone
        if: steps.signpath_check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-micmute-standalone
          path: stage-standalone/MicMute.exe
          retention-days: 1

      - name: Sign Standalone Binary via SignPath
        if: steps.signpath_check.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: micmute
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload_unsigned_standalone.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: stage-standalone-signed

      - name: Package Release Archives & SHA-256 Checksums
        shell: pwsh
        env:
          SIGNPATH_ENABLED: ${{ steps.signpath_check.outputs.enabled }}
        run: |
          function Resolve-ReleaseExe([string]$signedDir, [string]$unsignedExe) {
            if ($env:SIGNPATH_ENABLED -eq 'true') {
              $signedExe = Get-ChildItem -Path $signedDir -Filter 'MicMute.exe' -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $signedExe) {
                $signedZip = Get-ChildItem -Path $signedDir -Filter '*.zip' -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($signedZip) {
                  $extractDir = Join-Path $signedDir 'extracted'
                  Expand-Archive -LiteralPath $signedZip.FullName -DestinationPath $extractDir -Force
                  $signedExe = Get-ChildItem -Path $extractDir -Filter 'MicMute.exe' -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
                }
              }
              if (-not $signedExe) {
                throw "SignPath signing was enabled, but no signed MicMute.exe was found in $signedDir."
              }
              return $signedExe.FullName
            }
            return $unsignedExe
          }

          $lightExe = Resolve-ReleaseExe 'stage-light-signed' 'stage-light/MicMute.exe'
          $standaloneExe = Resolve-ReleaseExe 'stage-standalone-signed' 'stage-standalone/MicMute.exe'

          Compress-Archive -Path $lightExe -DestinationPath release-out/MicMute-win-x64.zip -CompressionLevel Optimal -Force
          Compress-Archive -Path $standaloneExe -DestinationPath release-out/MicMute-win-x64-standalone.zip -CompressionLevel Optimal -Force

          # Generate SHA-256 checksums
          $checksums = Get-ChildItem release-out/*.zip | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content -Path release-out/SHA256SUMS.txt -Encoding ascii

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MicMute ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          body: |
            ### Downloads (Windows 10 / 11 `x64`)

            | Package | Best For | Requirements |
            | :--- | :--- | :--- |
            | **`MicMute-win-x64.zip`** *(Lightweight, ~0.6 MB)* | Fastest download & smallest footprint (~1.35 MB `.exe`) | [.NET 8 Desktop Runtime (x64)](https://dotnet.microsoft.com/en-us/download/dotnet/8.0) |
            | **`MicMute-win-x64-standalone.zip`** *(Standalone)* | Plug-and-play on any Windows PC | None (self-contained) |

            Verify downloads with `SHA256SUMS.txt`.
          files: |
            release-out/MicMute-win-x64.zip
            release-out/MicMute-win-x64-standalone.zip
            release-out/SHA256SUMS.txt
